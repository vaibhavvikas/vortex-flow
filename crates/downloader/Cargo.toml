[package]
name = "vortexflow-downloader"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Decoupled multi-part chunked HTTP downloader engine with dynamic concurrency, auto-retry, and pause/resume lifecycle management"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
tokio-util = "0.7.13"
reqwest = { version = "0.12.12", features = ["json", "stream"] }
futures-util = "0.3.31"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tracing = "0.1.41"
thiserror = "2.0.11"
chrono = { version = "0.4.39", features = ["serde"] }
rand = "0.9.0"
