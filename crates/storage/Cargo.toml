[package]
name = "vortexflow-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "VortexFlow storage management, archive extraction, and genome repository organization"

[dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }
thiserror = "2.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"
