[package]
name = "vortexflow-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
axum = { version = "0.8" }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
vortexflow-providers = { path = "../../crates/providers" }
vortexflow-db = { path = "../../crates/db" }
vortexflow-downloader = { path = "../../crates/downloader" }
vortexflow-storage = { path = "../../crates/storage" }
vortexflow-logging = { path = "../../crates/logging" }
vortexflow-workflow = { path = "../../crates/workflow" }
vortexflow-engine = { path = "../../crates/engine" }
uuid = { version = "1.0", features = ["v4", "serde"] }
dirs = "6.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
